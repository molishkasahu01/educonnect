databases:
  - name: educonnect-db
    databaseName: educonnect
    user: educonnect
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: educonnect-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: EduConnect School Influencer Intelligence
      - key: APP_ENV
        value: production
      - key: TASK_QUEUE_MODE
        value: local
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-small-en-v1.5
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: EDXSO_ENABLE_DEFAULT_PUBLIC_WEB_SOURCES
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://educonnect-web.onrender.com,http://localhost:3000
      - key: DATABASE_URL
        fromDatabase:
          name: educonnect-db
          property: connectionString

  - type: web
    name: educonnect-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx next start -H 0.0.0.0 -p ${PORT:-3000}
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: same-origin
      - key: BACKEND_URL
        fromService:
          type: web
          name: educonnect-api
          property: host
