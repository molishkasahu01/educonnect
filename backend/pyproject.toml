[project]
name = "edxso-ai-backend"
version = "1.0.0"
description = "EDXSO School Influencer Intelligence - FastAPI, PostgreSQL/pgvector, Sentence Transformers AI/ML Backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "email-validator==2.2.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",
    "pgvector==0.3.6",
    "redis==5.2.1",
    "celery==5.4.0",
    "bcrypt==4.2.1",
    "pyjwt==2.10.1",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "numpy==2.2.1",
    "scikit-learn==1.6.1",
    "sentence-transformers==3.3.1",
    "openpyxl==3.1.5",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.8.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
